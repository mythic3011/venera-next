name: fresh-v2-schema

on:
  pull_request:
    paths:
      - "tools/v2-schema/**"
      - "docs/design/v2/02_DATABASE_SCHEMA.md"
      - ".github/workflows/fresh-v2-schema.yml"
  push:
    branches:
      - main
    paths:
      - "tools/v2-schema/**"
      - "docs/design/v2/02_DATABASE_SCHEMA.md"
      - ".github/workflows/fresh-v2-schema.yml"

permissions:
  contents: read

jobs:
  reference-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify Clean Canonical ContentUnit Schema
        run: node --test tools/v2-schema/test/*.test.mjs
